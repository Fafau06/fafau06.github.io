---
layout: default
---

{% for blog in site.blogs %}
  <div class="posts-container">
    <h1>
      <a href="{{ site.github.url }}{{ post.url }}">{{ post.title }}</a>
    </h1>
    {% if post.image %}
      <div>
        <a href="{{ site.github.url }}{{ post.url }}"><img src="{{ site.github.url }}/assets/img/{{ post.image }}"></a>
      </div>
    {% endif %}
    <p>
      {{ post.content | strip_html }}
      <span class="post-date"><i class="icon icon-calendar" aria-hidden="true"></i> {{ post.date | date_to_string }} - <i class="icon icon-clock" aria-hidden="true"></i> {% include read-time.html %}</span>
    </p>
    <hr>
  </div>
{% endfor %}

---
layout: default
---

{% for post in site.blogs %}
  <div class="posts-container">
    {% if post.image %}
      <div>
        <a href="{{ site.github.url }}{{ post.url }}"><img src="{{ site.github.url }}/assets/img/{{ post.image }}"></a>
      </div>
    {% endif %}
    <p>
      {{ post.content | strip_html }}
      <span class="post-date"><a class="border" href="{{ site.github.url }}{{ post.url }}"><i class="icon icon-comment" aria-hidden="true"></i></a>  <i class="icon icon-calendar" aria-hidden="true"></i> {{ post.date | date_to_string }} - <i class="icon icon-clock" aria-hidden="true"></i> {{ post.hour }} (UTC+7)</span>
    </p>
    <hr>
  </div>
{% endfor %}

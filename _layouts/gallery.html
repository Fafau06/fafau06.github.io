---
layout: default
---

<div class="gallery-year">
	<div><h2>2026</h2></div>
	<div class="gallery-linewrap">
		<div class="gallery-line"></div>
	</div>
</div>
<div class="gallery-container">
	{% assign gallery_2026 = site.gallery | where: "year", 2026 %}
	{% for item in gallery_2026 %}
    <div>
		<a href="{{ item.url | relative_url }}">
        <img src="{{ item.thumbnail | relative_url }}" alt="{{ item.title | escape }}" loading="lazy" decoding"async">
		</a>
    </div>
	{% endfor %}
</div>
<br>

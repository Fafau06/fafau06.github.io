---
layout: default
title: Tags
permalink: /tags/
---

<h1>Tags</h1>

<ul class="taxonomy-list">

  {% assign tags = site.tags | sort %}

  {% for tag in tags %}

    <li>

      <a
        class="taxonomy-pill tag-pill"
        href="{{ '/tags/' | append: tag[0] | slugify | append: '/' | relative_url }}"
      >
        {{ tag[0] }}
      </a>

      <span class="taxonomy-count">
        {{ tag[1].size }}
      </span>

    </li>

  {% endfor %}

</ul>

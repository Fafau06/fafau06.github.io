{% for item in site.data.settings.social %}
  {% assign first_char = item.link | slice: 0 %}
  {% if first_char == '/' %}
    <a href="{{ item.link }}" class="social-icon social-icon-{{ item.icon }}" aria-label="{{ item.icon }}"></a>
  {% else %}
    <a href="{{ item.link }}" target="_blank" class="social-icon social-icon-{{ item.icon }}" aria-hidden="true"></i></a>
  {% endif %}
{% endfor %}
